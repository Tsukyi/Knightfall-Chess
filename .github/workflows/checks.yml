name: Chess and browser checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify chess rules, bots, and lesson sequences
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Test desktop and mobile gameplay
        run: |
          npm start > /tmp/knightfall-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:5173/ > /dev/null && break; sleep 1; done
          npm run test:e2e
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knightfall-browser-screenshots
          path: artifacts/
          if-no-files-found: ignore
